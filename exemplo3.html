<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Rick and Morty Explorer</title>
  <style>
    body {
      font-family: sans-serif;
      background-color: #202329;
      color: white;
      text-align: center;
    }

    #container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      padding: 20px;
    }

    .card {
      background: #3c3e44;
      border-radius: 10px;
      padding: 10px;
      width: 200px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    }

    .card img {
      width: 100%;
      border-radius: 8px;
    }

    .status {
      font-weight: bold;
      color: #b2bec3;
    }

    button {
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      background: #97ce4c;
      border: none;
      border-radius: 5px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h1>Multiverso Rick and Morty</h1>
  <button onclick="buscarPersonagens()">Explorar Personagens</button>

  <div id="container"></div>

  <script>
    function buscarPersonagens() {
      const container = document.getElementById("container");
      const botao = document.querySelector("button");

      container.innerHTML = "Carregando...";
      botao.disabled = true;

      fetch("https://rickandmortyapi.com/api/character")
        .then(resposta => {
          if (!resposta.ok) {
            throw new Error("Não conseguimos acessar o multiverso!");
          }
          return resposta.json();
        })
        .then(dados => {
          container.innerHTML = "";

          dados.results.forEach(personagem => {
            const card = document.createElement("div");
            card.className = "card";

            // cor dinâmica do status
            const corStatus =
              personagem.status === "Alive" ? "lightgreen" :
              personagem.status === "Dead" ? "red" : "gray";

            card.innerHTML = `
              <img src="${personagem.image}" alt="${personagem.name}">
              <h3>${personagem.name}</h3>
              <p class="status">Espécie: ${personagem.species}</p>
              <p style="color:${corStatus}">Status: ${personagem.status}</p>
            `;

            container.appendChild(card);
          });
        })
        .catch(erro => {
          container.innerHTML = `<p style="color:red;">Ops! ${erro.message}</p>`;
          console.error("Erro detalhado:", erro);
        })
        .finally(() => {
          botao.disabled = false;
        });
    }
  </script>

</body>
</html>
